<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dirory Spike (M0)</title>
    <!--
      The SDK is loaded from Trimble's CDN, exactly as the "Creating an extension"
      doc shows. It defines window.SketchUpApi.

      Note the capital U. The docs write `SketchUpApi`, and a case-insensitive
      grep of the SDK bundle for `SketchupApi` finds nothing — see
      ../docs/GAPS.md, "names verified from the SDK".
    -->
    <script type="application/javascript" src="https://cdn.habitat.sketchup.com/dist/sketchup-js-api/v2/sketchup-js-api.js"></script>
    <script type="module" src="./spike.js"></script>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 13px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f7f8fa;
        color: #0f172a;
      }
      header {
        position: sticky; top: 0; z-index: 2;
        background: #fff; border-bottom: 1px solid #e2e6f0; padding: 12px 14px;
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      .sub { color: #5b6478; font-size: 12px; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      /* 44px minimum target height: this runs on iPad, where a miss is a tap loss. */
      button {
        min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #cbd5e1;
        background: #fff; font: inherit; font-weight: 600; cursor: pointer;
      }
      button.primary { background: #2f3f96; border-color: #2f3f96; color: #fff; }
      button:disabled { opacity: .5; }
      main { padding: 12px 14px 40px; }
      .row {
        background: #fff; border: 1px solid #e2e6f0; border-radius: 12px;
        padding: 10px 12px; margin-bottom: 8px;
      }
      .row h2 { font-size: 13px; margin: 0 0 4px; }
      .badge {
        display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .06em;
        text-transform: uppercase; border-radius: 999px; padding: 2px 8px; margin-right: 6px;
      }
      .PASS { background: #d1fae5; color: #065f46; }
      .PARTIAL { background: #fef3c7; color: #92400e; }
      .FAIL { background: #fee2e2; color: #991b1b; }
      .TODO { background: #e2e8f0; color: #334155; }
      pre {
        margin: 6px 0 0; white-space: pre-wrap; word-break: break-word;
        font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: #334155;
      }
      .warn { background: #fffbeb; border-color: #fde68a; }
      #out { margin-top: 14px; }
      textarea {
        width: 100%; min-height: 160px; margin-top: 8px; font: 11px/1.5 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Dirory — M0 spike</h1>
      <div class="sub" id="env">connecting…</div>
      <div class="bar">
        <button class="primary" id="run">Run all checks</button>
        <button id="signin">Sign in</button>
        <button id="copy">Copy results</button>
      </div>
    </header>

    <main>
      <div class="row warn">
        <h2>This is a probe, not the product</h2>
        <pre>
It exists to answer the M0 questions in SketchUp for Web and on iPad.
Every failure is reported, never swallowed — a failed check is a result.
Send the copied table back to docs/SPIKE.md.</pre>
      </div>

      <div id="list"></div>
      <div id="out" hidden>
        <h2>Copy this back</h2>
        <textarea id="report" readonly></textarea>
      </div>
    </main>
  </body>
</html>
